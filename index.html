<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commander Event Anmeldung</title>

<script type="module">

const firebaseConfig = {
  apiKey: "AIza....",
  authDomain: "deinprojekt.firebaseapp.com",
  databaseURL: "https://deinprojekt-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "deinprojekt",
  storageBucket: "deinprojekt.appspot.com",
  messagingSenderId: "123456789",
  appId: "1:123456:web:abcd1234"
};

<style>
body {
    font-family: Arial;
    text-align: center;
    background: #121212;
    color: white;
    padding: 40px;
}
input {
    padding: 10px;
    font-size: 16px;
    width: 250px;
}
button {
    padding: 10px 20px;
    font-size: 16px;
    background: #4CAF50;
    border: none;
    color: white;
    cursor: pointer;
}
.counter {
    font-size: 24px;
    margin-top: 30px;
}
</style>
</head>
<body>

<h1>Magic Commander Event Anmeldung</h1>

<input type="text" id="nameInput" placeholder="Dein Name">
<br><br>
<button onclick="register()">Jetzt Anmelden</button>

<div class="counter">
Bereits angemeldet: <span id="count">0</span> Spieler
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
    apiKey: "DEIN_API_KEY",
    authDomain: "DEIN_PROJECT.firebaseapp.com",
    databaseURL: "https://DEIN_PROJECT-default-rtdb.firebaseio.com",
    projectId: "DEIN_PROJECT",
    storageBucket: "DEIN_PROJECT.appspot.com",
    messagingSenderId: "XXXX",
    appId: "XXXX"
};

const app = initializeApp(firebaseConfig);
const database = getDatabase(app);

window.register = function() {
    const name = document.getElementById("nameInput").value;
    if (name.trim() === "") return alert("Bitte Namen eingeben!");

    push(ref(database, 'anmeldungen'), {
        name: name,
        timestamp: Date.now()
    });

    document.getElementById("nameInput").value = "";
}

const anmeldungenRef = ref(database, 'anmeldungen');
onValue(anmeldungenRef, (snapshot) => {
    const data = snapshot.val();
    const count = data ? Object.keys(data).length : 0;
    document.getElementById("count").innerText = count;
});
</script>

</body>
</html>
