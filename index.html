<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commander Event Anmeldung</title>

<style>
body {
    font-family: Arial;
    text-align: center;
    background: #121212;
    color: white;
    padding: 40px;
}
input {
    padding: 10px;
    font-size: 16px;
    width: 250px;
}
button {
    padding: 10px 20px;
    font-size: 16px;
    background: #4CAF50;
    border: none;
    color: white;
    cursor: pointer;
}
.counter {
    font-size: 24px;
    margin-top: 30px;
}
</style>

</head>
<body>

<h1>Magic: The Gathering @ The Home of Boxing</h1>

<input type="text" id="nameInput" placeholder="Dein Name">
<br><br>
<button onclick="register()">Jetzt Anmelden</button>

<div class="counter">
An der Magie nehmen bereits teil: <span id="count">0</span> Spieler
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* DEIN FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyCicFeRvQ31WMA2kH7o2gXHsZESrYIp2vA",
  authDomain: "commander-event.firebaseapp.com",
  databaseURL: "https://commander-event-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "commander-event",
  storageBucket: "commander-event.firebasestorage.app",
  messagingSenderId: "415266000388",
  appId: "1:415266000388:web:b85e766be989809c982f51",
  measurementId: "G-YFPQ4JRJ0T"
};

const app = initializeApp(firebaseConfig);
const database = getDatabase(app);

window.register = function() {
    const name = document.getElementById("nameInput").value;
    if (name.trim() === "") {
        alert("Bitte Namen eingeben!");
        return;
    }

    push(ref(database, 'anmeldungen'), {
        name: name,
        timestamp: Date.now()
    });

    document.getElementById("nameInput").value = "";
}

const anmeldungenRef = ref(database, 'anmeldungen');
onValue(anmeldungenRef, (snapshot) => {
    const data = snapshot.val();
    const count = data ? Object.keys(data).length : 0;
    document.getElementById("count").innerText = count;
});
</script>

</body>
</html>
